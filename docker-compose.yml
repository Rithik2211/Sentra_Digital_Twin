version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: sentra-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: sentra_user
      POSTGRES_PASSWORD: sentra_password
      POSTGRES_DB: sentra_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sentra_user -d sentra_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: sentra-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: sentra-backend
    ports:
      - "4000:4000"
    environment:
      - DATABASE_URL=postgresql://sentra_user:sentra_password@postgres:5432/sentra_db?schema=public
      - REDIS_URL=redis://redis:6379
      - GROQ_API_KEY=${GROQ_API_KEY}
      - PORT=4000
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: sentra-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  postgres_data:
  redis_data:
