version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: sentra-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: sentra_user
      POSTGRES_PASSWORD: sentra_password
      POSTGRES_DB: sentra_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sentra_user -d sentra_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: sentra-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data:
